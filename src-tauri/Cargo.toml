[package]
name = "pocket-notes"
version = "39.0.0"
description = "Pocket Notes — a notes app that lives on your device."
edition = "2021"
rust-version = "1.77"

# The version tracks the Pocket Notes app version (v39 here). When the live
# pocket-notes.html is updated, bump this to match and copy the new file into
# dist/index.html (see README.md).

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Native Save As dialog. Needed because the webview silently drops the
# browser anchor download (<a download>) on Windows — see README.md
# "Feature parity" and the save_text_file command in src/main.rs.
tauri-plugin-dialog = "2"
# Native fetch for web clips. The desktop shell fetches a pasted link
# server-side, so clipping works for any page — no browser CORS limit
# (the webapp's browser fetch only works where the site allows it).
# ureq is the smallest HTTP client that does this; rustls (tls) keeps
# HTTPS working. Size note: this is the one deliberate addition over the
# 20 MB installer budget's headroom — if the installer ever tips over
# 20 MB, this is the first place to look.
ureq = { version = "2", features = ["tls"] }
# Base64 for the read_bytes_file command (binary import). Tiny, no TLS.
base64 = "0.22"

# Size budget (standing rule — see SIZE-BUDGET.md): each installer must stay
# under 20 MB. For context, Logseq is ~135 MB and OneNote for Mac is ~626 MB.
# The release profile below is part of how the budget is held: optimize for
# size, strip symbols, link-time optimization, single codegen unit.
[profile.release]
opt-level = "s"
strip = true
lto = true
codegen-units = 1
panic = "abort"
